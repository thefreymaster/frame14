# Build: lints and builds the dashboard on every push and pull request, so the
# README's "build" badge says whether main compiles. Node 24 — the Dockerfile's.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oled-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: oled-dashboard/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
