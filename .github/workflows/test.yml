# Tests: the unit tests (Vitest: the client's libs and components, the
# server's routes and its Home Assistant socket against the stub) and the
# end-to-end tests (Playwright: the built app and the real server against the
# stub Home Assistant, in a desktop and a phone browser) on every push to main
# and every pull request. The README's "tests" badge is this workflow's status.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oled-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: oled-dashboard/package-lock.json

      - run: npm ci

      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oled-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: oled-dashboard/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: oled-dashboard/playwright-report
          retention-days: 14
